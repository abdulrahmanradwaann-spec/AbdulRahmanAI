<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abdulrahman AI | دليل أدوات الذكاء الاصطناعي</title>
    
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Abdulrahman AI">
    <meta name="description" content="Your ultimate guide to AI tools - 500+ tools in one place">
    <meta name="author" content="Abdulrahman Radwan">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- مؤشر التحميل -->
    <div class="page-loader-full" id="pageLoaderFull">
        <div class="spinner"></div>
    </div>
    
    <!-- شريط التقدم -->
    <div class="progress-bar" id="progressBar"></div>
    
    <!-- زر تبديل الوضع -->
    <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>
    
    <!-- خلفية الجسيمات -->
    <canvas id="particle-canvas"></canvas>
    
    <div class="container">
        <!-- الهيدر -->
        <header class="header">
            <div class="header-bg">
                <div class="circuit-lines"></div>
                <div class="glow-orb orb-1"></div>
                <div class="glow-orb orb-2"></div>
                <div class="glow-orb orb-3"></div>
            </div>
            <h1>Abdulrahman AI</h1>
            <div class="typing-container">
                <span id="typingText"></span>
                <span class="cursor"></span>
            </div>
            <p class="header-subtitle">Your Ultimate Guide to AI Tools</p>
        </header>
        
        <!-- مسار التنقل -->
        <div class="breadcrumbs" id="breadcrumbs">
            <a href="/">Home</a>
        </div>
        
        <!-- البحث -->
        <div class="search-section">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search for AI tools..." autocomplete="off">
                <i class="fas fa-times clear-search" id="clearSearch"></i>
                <div class="autocomplete-box" id="autocompleteBox"></div>
            </div>
        </div>
        
        <!-- أدوات الترتيب -->
        <div class="sort-controls" id="sortControls">
            <button class="sort-btn active" data-sort="default">Default</button>
            <button class="sort-btn" data-sort="name">By Name</button>
            <button class="sort-btn" data-sort="count">By Count</button>
        </div>
        
        <!-- المحتوى -->
        <div id="contentContainer"></div>
        <div id="noResults">
            <i class="fas fa-exclamation-circle"></i>
            <div>No tools match your search. Try another keyword!</div>
        </div>
    </div>
    
    <!-- زر العودة للأعلى -->
    <div class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fas fa-chevron-up"></i>
    </div>
    
    <!-- زر الشريط الجانبي -->
    <button class="new-sidebar-toggle" id="newSidebarToggle" title="Open Menu">
        <i class="fas fa-bars"></i>
    </button>
    
    <!-- الشريط الجانبي -->
    <div class="new-sidebar" id="newSidebar">
        <div class="new-sidebar-header">
            <h3>Smart Menu</h3>
            <i class="fas fa-times" id="newSidebarClose"></i>
        </div>
        <div class="new-sidebar-content">
            <div class="new-stats">
                <div class="new-stat-item">
                    <i class="fas fa-folder"></i>
                    <span id="newStatCategories">0</span>
                    <span>Categories</span>
                </div>
                <div class="new-stat-item">
                    <i class="fas fa-tools"></i>
                    <span id="newStatTools">0</span>
                    <span>Tools</span>
                </div>
                <div class="new-stat-item">
                    <i class="fas fa-star"></i>
                    <span id="newFavCount">0</span>
                    <span>Favorites</span>
                </div>
            </div>
            
            <div class="new-section">
                <h4><i class="fas fa-star"></i> My Favorites</h4>
                <ul class="new-favorites" id="newFavoritesList"></ul>
            </div>
        </div>
    </div>
    
    <!-- حاوية الإشعارات -->
    <div class="new-toast-container" id="newToastContainer"></div>
    
    <!-- الفوتر -->
    <footer class="footer">
        <div class="footer-brand">
            <span class="footer-name">Abdulrahman Radwan</span>
            <span class="footer-year">2026</span>
        </div>
        <p class="footer-rights">All Rights Reserved</p>
    </footer>
    
    <a href="#contentContainer" class="skip-to-content">Skip to content</a>
    
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
