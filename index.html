<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الرحمن تكنولوجيا | الدليل الشامل للذكاء الاصطناعي 2026</title>
    <!-- Font Awesome 6 (أيقونات محدثة) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: مزيج أنيق من Plus Jakarta Sans وCairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* متغيرات ثيم متقدمة محدثة 2026 */
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-light: #f8fafc;
            --bg-dark: #0f172a;
            --surface-light: rgba(255, 255, 255, 0.7);
            --surface-dark: rgba(30, 41, 59, 0.8);
            --text-light: #1e293b;
            --text-dark: #f1f5f9;
            --border-light: rgba(203, 213, 225, 0.5);
            --border-dark: rgba(51, 65, 85, 0.5);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-hover: 0 30px 60px -15px rgba(59,130,246,0.5);
            --glass-border: 1px solid rgba(255, 255, 255, 0.2);
            --glass-border-dark: 1px solid rgba(255, 255, 255, 0.05);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
            background: linear-gradient(145deg, var(--bg-light) 0%, #eef2f6 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59,130,246,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139,92,246,0.1) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 8px);
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
            mix-blend-mode: overlay;
            animation: rotate 60s linear infinite;
            z-index: -1;
            opacity: 0.5;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(145deg, var(--bg-dark) 0%, #0b1120 100%);
                color: var(--text-dark);
            }
            body::before {
                background: 
                    radial-gradient(circle at 20% 30%, rgba(59,130,246,0.2) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(139,92,246,0.2) 0%, transparent 50%),
                    repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 8px);
            }
            body::after {
                background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, transparent 60%);
                mix-blend-mode: soft-light;
            }
        }

        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 10;
        }

        .header {
            padding: 60px 0 30px;
            text-align: center;
            animation: reveal 1s ease-out;
        }

        @keyframes reveal {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-size: 4.5rem;
            font-weight: 800;
            background: linear-gradient(145deg, var(--primary), var(--secondary), var(--accent));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
            letter-spacing: -1.5px;
            animation: gradientShift 6s infinite, float 5s ease-in-out infinite;
            text-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .typing-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 500;
            min-height: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            width: fit-content;
            margin: 0 auto;
            padding: 12px 32px;
            border-radius: 60px;
            border: 1px solid rgba(59,130,246,0.3);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.2);
        }

        #typingText {
            direction: ltr;
            font-family: 'Plus Jakarta Sans', monospace;
        }

        .cursor {
            width: 3px;
            height: 2rem;
            background: var(--primary);
            border-radius: 3px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .search-section {
            margin: 40px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            transform: scale(1);
            transition: transform 0.4s;
        }

        .search-wrapper:hover {
            transform: scale(1.02);
        }

        .search-wrapper input {
            width: 100%;
            padding: 20px 70px 20px 30px;
            border: none;
            border-radius: 70px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(59,130,246,0.2);
            font-size: 1.2rem;
            font-family: inherit;
            color: inherit;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.1);
            transition: all 0.4s;
            user-select: text;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 8px rgba(59,130,246,0.2), 0 20px 40px -15px var(--primary);
            background: rgba(255,255,255,0.95);
        }

        .search-wrapper i {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.6rem;
            color: var(--primary);
            transition: transform 0.3s;
            pointer-events: none;
        }

        .search-wrapper:hover i {
            transform: translateY(-50%) rotate(10deg) scale(1.1);
        }

        .toolbar {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: var(--surface-light);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59,130,246,0.3);
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: inherit;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .toolbar-btn:hover {
            background: var(--primary);
            color: white;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -8px var(--primary);
        }

        @media (prefers-color-scheme: dark) {
            .toolbar-btn {
                background: var(--surface-dark);
                border-color: rgba(255,255,255,0.1);
            }
        }

        .category {
            margin-bottom: 25px;
            border-radius: 50px;
            background: var(--surface-light);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            overflow: hidden;
            transition: var(--transition);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-color-scheme: dark) {
            .category {
                background: var(--surface-dark);
                border-color: var(--glass-border-dark);
            }
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 35px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .category-header:hover {
            background: rgba(59,130,246,0.1);
        }

        .category-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            transition: transform 0.4s;
            flex-shrink: 0;
        }

        .category-header:hover .category-icon {
            transform: rotate(360deg) scale(1.1);
        }

        .category-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(145deg, var(--text-light), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            flex: 1;
        }

        @media (prefers-color-scheme: dark) {
            .category-title {
                background: linear-gradient(145deg, #fff, var(--primary));
                -webkit-background-clip: text;
                background-clip: text;
            }
        }

        .category-count {
            background: rgba(59,130,246,0.15);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            border: 1px solid rgba(59,130,246,0.3);
            transition: var(--transition);
        }

        .category-header:hover .category-count {
            background: var(--primary);
            color: white;
            border-color: transparent;
        }

        .toggle-icon {
            font-size: 1.6rem;
            color: var(--primary);
            transition: transform 0.4s;
            width: 30px;
            text-align: center;
        }

        .category.expanded .toggle-icon {
            transform: rotate(180deg);
        }

        .category-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.6s ease-in-out, opacity 0.4s ease, padding 0.4s;
            padding: 0 25px;
        }

        .category.expanded .category-content {
            max-height: 5000px;
            opacity: 1;
            padding: 0 25px 25px 25px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            margin-top: 15px;
        }

        .tool-card {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 24px 20px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.9);
            animation: cardAppear 0.4s forwards;
            animation-delay: calc(0.02s * var(--card-index, 1));
        }

        @media (prefers-color-scheme: dark) {
            .tool-card {
                background: rgba(0,0,0,0.2);
                border-color: rgba(255,255,255,0.1);
            }
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: scale(1); }
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            transform: scaleX(0);
            transition: transform 0.6s;
            transform-origin: right;
        }

        .tool-card:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .tool-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-hover);
            background: rgba(255,255,255,0.95);
            border-color: transparent;
        }

        .card-icon {
            width: 65px;
            height: 65px;
            background: linear-gradient(145deg, #e0f2fe, #ede9fe);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 18px;
            transition: var(--transition);
            box-shadow: 0 8px 12px -5px rgba(59,130,246,0.3);
        }

        .tool-card:hover .card-icon {
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            color: white;
            transform: rotate(5deg) scale(1.1);
            box-shadow: 0 12px 20px -5px var(--primary);
        }

        .tool-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .tool-desc {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 18px;
            flex: 1;
            line-height: 1.6;
        }

        @media (prefers-color-scheme: dark) {
            .tool-desc {
                color: #a0aec0;
            }
        }

        .tool-link {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(59,130,246,0.1);
            border-radius: 40px;
            color: inherit;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            border: 1px solid rgba(59,130,246,0.2);
            align-self: flex-start;
            margin-top: 5px;
            width: 100%;
            max-width: 130px;
        }

        .tool-link:hover {
            background: var(--primary);
            color: white;
            gap: 12px;
            border-color: transparent;
            box-shadow: 0 8px 15px -5px var(--primary);
        }

        .tool-link i {
            font-size: 0.8rem;
            transition: transform 0.3s;
        }

        .tool-link:hover i {
            transform: translateX(-5px);
        }

        #noResults {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.8rem;
            color: #94a3b8;
            display: none;
            animation: fadeIn 0.5s;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            margin: 40px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .back-to-top {
            position: fixed;
            bottom: 35px;
            right: 35px;
            width: 65px;
            height: 65px;
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(59,130,246,0.5);
            transition: var(--transition);
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 99;
            animation: softPulse 3s infinite;
        }

        @keyframes softPulse {
            0% { box-shadow: 0 10px 25px rgba(59,130,246,0.5); }
            50% { box-shadow: 0 10px 40px rgba(59,130,246,0.9); }
            100% { box-shadow: 0 10px 25px rgba(59,130,246,0.5); }
        }

        .back-to-top:hover {
            transform: scale(1.2) rotate(360deg);
            background: linear-gradient(145deg, var(--secondary), var(--accent));
            box-shadow: 0 15px 35px rgba(139,92,246,0.7);
        }

        .back-to-top i {
            font-size: 1.8rem;
        }

        .footer {
            text-align: center;
            padding: 35px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(59,130,246,0.2);
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.05);
            font-size: 1.1rem;
        }

        .footer .copyright {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 3rem; }
            .typing-container { font-size: 1.2rem; padding: 10px 20px; }
            .category-header { padding: 15px 20px; }
            .category-title { font-size: 1.6rem; }
            .category-icon { width: 45px; height: 45px; font-size: 1.4rem; }
            .toggle-icon { font-size: 1.4rem; }
            .tools-grid { gap: 18px; }
            .back-to-top { width: 55px; height: 55px; bottom: 20px; left: 20px; }
            .category-content { padding: 0 15px; }
            .category.expanded .category-content { padding: 0 15px 15px 15px; }
        }

        @media (max-width: 480px) {
            .container { padding: 0 16px; }
            .header h1 { font-size: 2.5rem; }
            .search-wrapper input { padding: 18px 55px 18px 20px; font-size: 1rem; }
            .category-header { gap: 10px; }
            .category-title { font-size: 1.3rem; }
            .category-count { padding: 3px 10px; font-size: 0.8rem; }
        }

        img, a, i {
            -webkit-user-drag: none;
            user-drag: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>عبد الرحمن تكنولوجيا</h1>
            <div class="typing-container">
                <span id="typingText"></span>
                <span class="cursor"></span>
            </div>
        </header>

        <div class="search-section">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="ابحث عن أداة ذكاء اصطناعي..." onkeyup="filterTools()">
                <i class="fas fa-search"></i>
            </div>
            <div class="toolbar">
                <button class="toolbar-btn" id="expandAllBtn"><i class="fas fa-expand-alt"></i> فتح الكل</button>
                <button class="toolbar-btn" id="collapseAllBtn"><i class="fas fa-compress-alt"></i> إغلاق الكل</button>
            </div>
        </div>

        <div id="categoriesContainer"></div>
        <div id="noResults">
            <i class="fas fa-exclamation-circle"></i> لا توجد أدوات تطابق بحثك. جرب كلمة أخرى!
        </div>
    </div>

    <div class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </div>

    <footer class="footer">

    </footer>

        // تأثير الكتابة المحسن
        const textElement = document.getElementById('typingText');
        const phrases = ["دليل متكامل لأدوات الذكاء الاصطناعي", "اكتشف المستقبل اليوم", "أحدث تقنيات 2026", "أكثر من 400 أداة AI"];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeEffect() {
            const currentPhrase = phrases[phraseIndex];
            if (isDeleting) {
                textElement.innerHTML = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    setTimeout(typeEffect, 400);
                    return;
                }
            } else {
                textElement.innerHTML = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === currentPhrase.length) {
                    isDeleting = true;
                    setTimeout(typeEffect, 2000);
                    return;
                }
            }
            setTimeout(typeEffect, isDeleting ? 60 : 120);
        }
        setTimeout(typeEffect, 1000);

        // متغيرات للتحكم بالأكورديون
        let currentOpenCategory = null;

        function toggleCategory(categoryElement, forceState = null) {
            const isExpanded = categoryElement.classList.contains('expanded');
            const shouldExpand = forceState !== null ? forceState : !isExpanded;

            if (shouldExpand && currentOpenCategory && currentOpenCategory !== categoryElement) {
                currentOpenCategory.classList.remove('expanded');
            }

            if (shouldExpand) {
                categoryElement.classList.add('expanded');
                currentOpenCategory = categoryElement;
            } else {
                categoryElement.classList.remove('expanded');
                if (currentOpenCategory === categoryElement) {
                    currentOpenCategory = null;
                }
            }
        }

        function renderAllTools() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            categories.forEach((cat, catIndex) => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                categoryDiv.dataset.index = catIndex;

                const toolsHtml = cat.tools.map((tool, index) => `
                    <div class="tool-card" style="--card-index: ${index + 1};">
                        <div class="card-icon"><i class="${tool.icon}"></i></div>
                        <h3 class="tool-name">${tool.name}</h3>
                        <p class="tool-desc">${tool.desc}</p>
                        <a href="${tool.url}" class="tool-link" target="_blank" rel="noopener noreferrer">
                            <span>زيارة</span>
                            <i class="fa-solid fa-arrow-left"></i>
                        </a>
                    </div>
                `).join('');

                categoryDiv.innerHTML = `
                    <div class="category-header">
                        <div class="category-icon"><i class="${cat.icon}"></i></div>
                        <h2 class="category-title">${cat.name}</h2>
                        <span class="category-count">${cat.tools.length} أداة</span>
                        <span class="toggle-icon"><i class="fas fa-chevron-down"></i></span>
                    </div>
                    <div class="category-content">
                        <div class="tools-grid">
                            ${toolsHtml}
                        </div>
                    </div>
                `;

                const header = categoryDiv.querySelector('.category-header');
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleCategory(categoryDiv);
                });

                container.appendChild(categoryDiv);
            });

            currentOpenCategory = null;
        }

        function expandAll() {
            document.querySelectorAll('.category').forEach(cat => {
                cat.classList.add('expanded');
            });
            const allCats = document.querySelectorAll('.category');
            if (allCats.length > 0) {
                currentOpenCategory = allCats[allCats.length - 1];
            }
        }

        function collapseAll() {
            document.querySelectorAll('.category').forEach(cat => {
                cat.classList.remove('expanded');
            });
            currentOpenCategory = null;
        }

        function filterTools() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('categoriesContainer');
            const noResults = document.getElementById('noResults');

            if (query === '') {
                renderAllTools();
                noResults.style.display = 'none';
                return;
            }

            let anyVisible = false;
            container.innerHTML = '';

            categories.forEach((cat, catIndex) => {
                const filteredTools = cat.tools.filter(tool =>
                    tool.name.toLowerCase().includes(query) ||
                    tool.desc.toLowerCase().includes(query)
                );

                if (filteredTools.length > 0) {
                    anyVisible = true;
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'category expanded';
                    categoryDiv.dataset.index = catIndex;

                    const toolsHtml = filteredTools.map((tool, index) => `
                        <div class="tool-card" style="--card-index: ${index + 1};">
                            <div class="card-icon"><i class="${tool.icon}"></i></div>
                            <h3 class="tool-name">${tool.name}</h3>
                            <p class="tool-desc">${tool.desc}</p>
                            <a href="${tool.url}" class="tool-link" target="_blank" rel="noopener noreferrer">
                                <span>زيارة</span>
                                <i class="fa-solid fa-arrow-left"></i>
                            </a>
                        </div>
                    `).join('');

                    categoryDiv.innerHTML = `
                        <div class="category-header">
                            <div class="category-icon"><i class="${cat.icon}"></i></div>
                            <h2 class="category-title">${cat.name}</h2>
                            <span class="category-count">${filteredTools.length} نتيجة</span>
                            <span class="toggle-icon"><i class="fas fa-chevron-down"></i></span>
                        </div>
                        <div class="category-content">
                            <div class="tools-grid">
                                ${toolsHtml}
                            </div>
                        </div>
                    `;

                    const header = categoryDiv.querySelector('.category-header');
                    header.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleCategory(categoryDiv);
                    });

                    container.appendChild(categoryDiv);
                }
            });

            if (anyVisible) {
                noResults.style.display = 'none';
                const expandedCats = document.querySelectorAll('.category.expanded');
                if (expandedCats.length > 0) {
                    currentOpenCategory = expandedCats[expandedCats.length - 1];
                }
            } else {
                noResults.style.display = 'block';
                container.innerHTML = '';
            }
        }

        // منع النسخ وأدوات المطور (حماية إضافية)
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'x' || e.key === 'v' || e.key === 's' || e.key === 'p')) {
                e.preventDefault();
                alert("النسخ غير مسموح به.");
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
                alert("أدوات المطور مقفلة.");
            }
        });
        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            alert("النقر بالزر الأيمن غير متاح.");
        });

        window.onload = () => {
            renderAllTools();
            document.getElementById('expandAllBtn').addEventListener('click', expandAll);
            document.getElementById('collapseAllBtn').addEventListener('click', collapseAll);
        };
    </script>
